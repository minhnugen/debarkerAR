<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Experience</title>
    <!-- Import the <model-viewer> library -->
    <script type="module" src="https://jsdelivr.net"></script>
</head>
<body style="margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;">

    <!-- The viewer handles the 3D display and the AR button -->
    <model-viewer 
        src="test.glb" 
        ios-src="cube.usdz" 
        ar 
        ar-modes="quick-look webxr scene-viewer" 
        camera-controls 
        touch-action="none"
        style="width: 100%; height: 100%;">
    </model-viewer>

</body>
</html>
