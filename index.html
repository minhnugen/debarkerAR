<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>

    <title>HTML + CSS</title>
  </head>
  <body>
    <model-viewer
      src="debarker.glb"
      ios-src="debarker.usdz"
      alt="A 3D model"
      autoplay
      style="width: 100vw; height: 90vh"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="2"
      ar
    >
      <button id="ar-button" slot="ar-button">Start AR</button>
    </model-viewer>
  </body>

  <style>
    #ar-button {
      width: 120px;
      height: 60px;
    }
  </style>
</html>
